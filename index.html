<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Content Manager Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="loginScreen" class="screen">
        <div class="login-container">
            <h1 class="brand-logo">ContentPlanner<span>.io</span></h1>
            <div class="login-box modern-card">
                <h2>Client Portal Login</h2>
                <form id="loginForm">
                    <div class="input-group">
                        <label>Username</label>
                        <input type="text" id="username" placeholder="Your brand name" required>
                    </div>
                    <div class="input-group">
                        <label>Password</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="btn-primary">Sign In</button>
                </form>
                <p id="errorMessage" class="error-text"></p>
            </div>
        </div>
    </div>

    <div id="dashboard" class="screen hidden">
        <header class="main-header">
            <div class="header-inner">
                <div class="logo">ContentPlanner</div>
                <div class="header-actions">
                    <span id="currentUserDisplay" class="user-pill"></span>
                    <button id="logoutBtn" class="btn-outline">Logout</button>
                </div>
            </div>
        </header>

        <main class="container">
            <div class="view-nav">
                <button id="btnListView" class="tab-btn active">List View</button>
                <button id="btnCalendarView" class="tab-btn">Monthly Calendar</button>
            </div>

            <section id="adminSection" class="modern-card hidden">
                <h3>Schedule New Content</h3>
                <form id="taskForm" class="grid-form">
                    <div class="form-row">
                        <input type="text" id="taskTitle" placeholder="Post Title" required>
                        <input type="text" id="clientName" placeholder="Client Username" required>
                        <input type="date" id="taskDate" required>
                        <select id="platformType">
                            <option value="instagram">Instagram</option>
                            <option value="tiktok">TikTok</option>
                            <option value="linkedin">LinkedIn</option>
                        </select>
                    </div>
                    <div class="form-row">
                        <input type="url" id="canvaLink" placeholder="Canva URL">
                        <input type="url" id="postLink" placeholder="Live Post URL">
                        <select id="taskStatus">
                            <option value="upcoming">Upcoming</option>
                            <option value="current">Current</option>
                            <option value="finished">Finished</option>
                        </select>
                        <button type="submit" class="btn-primary">Add Task</button>
                    </div>
                </form>
            </section>

            <div id="listView">
                <div class="kanban-board">
                    <div class="column">
                        <h4>Upcoming</h4>
                        <div id="upcomingTasks" class="task-list"></div>
                    </div>
                    <div class="column">
                        <h4>In Progress</h4>
                        <div id="currentTasks" class="task-list"></div>
                    </div>
                    <div class="column">
                        <h4>Published</h4>
                        <div id="finishedTasks" class="task-list"></div>
                    </div>
                </div>
            </div>

            <div id="calendarView" class="hidden">
                <div class="calendar-header">
                    <h2 id="calendarTitle">Month</h2>
                </div>
                <div id="calendarGrid" class="calendar-grid"></div>
            </div>
        </main>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
